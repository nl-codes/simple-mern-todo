services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - frontend/.env
    command: npm run dev -- --host 0.0.0.0
    networks:
      - sm-public-net
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "5050:5050"
    env_file:
      - backend/.env
    depends_on:
      - mongo
    networks:
      - sm-private-net

  mongo:
    image: mongo:7
    volumes:
      - sm-db:/data/db
    networks:
      - sm-private-net


volumes:
  sm-db:

networks:
  sm-public-net:
  sm-private-net:
