name: Frontend CI/CD

on:
  push:
    branches: [master]
    paths: ['frontend/**'] # only when frontend code changes

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Build and push
            run: bash ../../scripts/build-and-push.sh
            env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                IMAGE: simple-mern-todo
                TAG: frontend
                CONTEXT: ./frontend

    deploy:
        needs: build-and-push # only after the image is pushed
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Deploy to EC2
              run: bash scripts/deploy.sh
              env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                IMAGE: simple-mern-todo
                CONTAINER: sm-frontend
                TAG: frontend
                PORT: 5050
                EC2_HOST: ${{ secrets.EC2_HOST }}
                EC2_USER: ${{ secrets.EC2_USER }}
                EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
